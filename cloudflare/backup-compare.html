<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バックアップの比較</title><style>body{font:16px/1.7 sans-serif;max-width:45rem;margin:auto;padding:1rem;color:#17243c}label{display:block;margin:1em 0}input{display:block;max-width:100%}button{padding:.8rem;background:#1c497e;color:white;border:0;border-radius:.5rem}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:.4rem;text-align:left}.warning{color:#8e2b16;overflow-wrap:anywhere}</style></head><body><h1>バックアップの比較</h1><p>統合前と統合後の JSON を選んでください。ファイルはこの画面内だけで読み込み、送信・復元・変更しません。差分がある場合は内容を確認してください。</p><label>統合前 <input id="before" type="file" accept="application/json,.json"></label><label>統合後 <input id="after" type="file" accept="application/json,.json"></label><button id="compare">比較する</button><div id="result" aria-live="polite"></div><script src="migration-preview.js"></script><script>
document.getElementById('compare').onclick=async()=>{const out=document.getElementById('result');out.replaceChildren();try{const a=document.getElementById('before').files[0],b=document.getElementById('after').files[0];if(!a||!b)throw Error('２つのバックアップファイルを選んでください');const r=HQMigrationPreview.compare(await a.text(),await b.text());const labels={menus:'学習メニュー',completions:'完了履歴',questXP:'クエスト XP',bonusXP:'追加 XP',level:'レベル',sessions:'学習時間の記録',minutes:'学習時間（分）',answers:'学習回答',matches:'試合履歴',plays:'ゲームのプレー'};const table=document.createElement('table'),head=document.createElement('tr');for(const t of ['項目','統合前','統合後']){const th=document.createElement('th');th.textContent=t;head.appendChild(th)}table.appendChild(head);for(const [key,label] of Object.entries(labels)){const tr=document.createElement('tr');for(const v of [label,r.before[key],r.after[key]]){const td=document.createElement('td');td.textContent=String(v);tr.appendChild(td)}table.appendChild(tr)}out.appendChild(table);const lines=[['統合後にないメニュー ID',r.missingMenuIds],['削除状態が変わったメニュー ID',r.changedDeletionIds],['統合後にない完了履歴 ID',r.missingCompletionIds],['内容が変わった完了履歴 ID',r.changedCompletionIds],['統合後にない追加 XP の獲得 ID',r.missingAwardIds],['統合後にない学習時間記録の件数',r.missingSessions],['統合後にない学習回答の件数',r.missingAnswers],['統合後にない試合履歴の件数',r.missingMatches],['英検進捗の差分',r.eikenChanged?'あり':'なし'],['ゲーム進捗の差分',r.gameChanged?'あり':'なし'],['その他の変更項目',r.otherFieldsChanged]];for(const [label,val] of lines){const p=document.createElement('p');p.textContent=label+'：'+(Array.isArray(val)?val.join('、')||'なし':val);if((Array.isArray(val)&&val.length)||(typeof val==='number'&&val>0)||val==='あり')p.className='warning';out.appendChild(p)}const note=document.createElement('p');note.textContent='差分はデータ消失を意味するとは限りません。変更内容を確認し、不明な場合は統合前のバックアップを保管したまま作業を停止してください。';out.appendChild(note)}catch(e){out.textContent='比較できません：'+e.message}};
</script></body></html>
