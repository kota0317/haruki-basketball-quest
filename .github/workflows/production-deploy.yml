name: Deploy configured production sync API
on:
  push:
    branches: [main]
    paths: ['cloudflare/worker.mjs', 'cloudflare/operation-engine.mjs', 'cloudflare/migrations/**', '.github/workflows/production-deploy.yml']
  workflow_dispatch:
    inputs:
      worker_name:
        description: Existing dedicated production Worker name
        required: false
        default: haruki-production-inactive-44733572133
        type: string
      database_name:
        description: Dedicated production D1 database name
        required: false
        default: haruki-sync-qa-44663546163
        type: string
      database_id:
        description: Dedicated production D1 database UUID
        required: false
        default: 31dc86e4-3cc5-42dc-a738-5a9a6259747f
        type: string
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/cloudflare-parent-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: haruki-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FAMILY_CODE: ${{ secrets.HARUKI_FAMILY_CODE }}
      WORKER_NAME: ${{ inputs.worker_name || 'haruki-production-inactive-44733572133' }}
      DATABASE_NAME: ${{ inputs.database_name || 'haruki-sync-qa-44663546163' }}
      DATABASE_ID: ${{ inputs.database_id || '31dc86e4-3cc5-42dc-a738-5a9a6259747f' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts wrangler
      - name: Verify target and record-preserving deploy preconditions
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN'];code=os.environ.get('FAMILY_CODE','');worker=os.environ['WORKER_NAME'];name=os.environ['DATABASE_NAME'];dbid=os.environ['DATABASE_ID'];base='https://api.cloudflare.com/client/v4'
          if not re.fullmatch(r'[0-9]{5}',code) or code=='12345':raise SystemExit('Set HARUKI_FAMILY_CODE to a production-only five-digit value, not the test value')
          if not re.fullmatch(r'haruki-production(?:-inactive)?-[0-9]+',worker) or not re.fullmatch(r'haruki-(?:production|sync-qa)-[0-9]+',name) or not re.fullmatch(r'[0-9a-f-]{36}',dbid):raise SystemExit('Unexpected production resource identifier')
          def call(path,payload=None):
              req=urllib.request.Request(base+path,data=None if payload is None else json.dumps(payload).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
              if not data.get('success'):raise SystemExit('Cloudflare verification failed')
              return data['result']
          accounts=call('/accounts?per_page=50')
          if len(accounts)!=1:raise SystemExit('Account selection is ambiguous')
          account=accounts[0]['id'];prefix='/accounts/'+account
          if call(prefix+'/d1/database/'+dbid)['name']!=name:raise SystemExit('Database name does not match UUID')
          settings=call(prefix+'/workers/scripts/'+worker+'/settings');bound=[x for x in settings['bindings'] if x.get('type')=='d1' and x.get('name')=='DB']
          if len(bound)!=1 or (bound[0].get('database_id') or bound[0].get('id'))!=dbid:raise SystemExit('Worker is not bound to the selected D1')
          rows=call(prefix+'/d1/database/'+dbid+'/query',{'sql':'SELECT revision,body FROM family_snapshot WHERE id=1'})
          if not rows or len(rows[0].get('results',[]))!=1:raise SystemExit('Expected one snapshot row')
          snapshot=rows[0]['results'][0];revision=int(snapshot['revision']);raw=snapshot.get('body')
          logical=None;generation='initial'
          if raw is not None:
              try:logical=json.loads(raw)
              except Exception:raise SystemExit('Snapshot is not valid JSON; no data was changed')
              if not isinstance(logical,dict):raise SystemExit('Snapshot format is not an object; no data was changed')
              if '__hq_sync_generation' in logical:
                  generation=logical.pop('__hq_sync_generation')
                  if not isinstance(generation,str) or not generation:raise SystemExit('Invalid reset generation; no data was changed')
                  if not logical:logical=None
          digest=hashlib.sha256(json.dumps(logical,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('EXPECTED_REVISION='+str(revision)+'\n')
              f.write('EXPECTED_GENERATION='+generation+'\n')
              f.write('EXPECTED_DATA_SHA256='+digest+'\n')
              f.write('CLOUDFLARE_ACCOUNT_ID='+account+'\n')
          cfg={'name':worker,'main':'cloudflare/worker.mjs','compatibility_date':'2026-11-01','account_id':account,'workers_dev':True,'vars':{'ALLOWED_ORIGIN':'https://kota0317.github.io'},'d1_databases':[{'binding':'DB','database_name':name,'database_id':dbid}]}
          open('wrangler.json','w').write(json.dumps(cfg))
          print('Target D1 binding and current snapshot metadata verified; data content remains undisclosed')
          PY
      - name: Add operation ledger and archive current D1 snapshot
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'];dbid=os.environ['DATABASE_ID'];token=os.environ['CLOUDFLARE_API_TOKEN'];base='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+dbid+'/query'
          def query(sql,params=None):
              body={'sql':sql}
              if params is not None:body['params']=params
              req=urllib.request.Request(base,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
              if not data.get('success'):raise SystemExit('D1 migration query failed; production data was not reset')
              return data.get('result',[])
          query('CREATE TABLE IF NOT EXISTS family_operation (operation_id TEXT PRIMARY KEY, type TEXT NOT NULL, payload TEXT NOT NULL, base_revision INTEGER NOT NULL, applied_revision INTEGER NOT NULL, created_at TEXT NOT NULL)')
          query('CREATE INDEX IF NOT EXISTS family_operation_created_at ON family_operation(created_at)')
          query('CREATE TABLE IF NOT EXISTS family_snapshot_archive (source_revision INTEGER PRIMARY KEY, body TEXT, archived_at TEXT NOT NULL)')
          query('INSERT OR IGNORE INTO family_snapshot_archive(source_revision,body,archived_at) SELECT revision,body,datetime(\'now\') FROM family_snapshot WHERE id=1 AND revision=?',[int(os.environ['EXPECTED_REVISION'])])
          archived=query('SELECT source_revision,body FROM family_snapshot_archive WHERE source_revision=?',[int(os.environ['EXPECTED_REVISION'])])
          current=query('SELECT revision,body FROM family_snapshot WHERE id=1')
          saved=archived[0].get('results',[]) if archived else [];live=current[0].get('results',[]) if current else []
          if len(saved)!=1 or len(live)!=1 or int(live[0]['revision'])!=int(os.environ['EXPECTED_REVISION']) or saved[0].get('body')!=live[0].get('body'):
              raise SystemExit('Snapshot archive verification failed; deployment stopped before Worker update')
          print('PASS: exact pre-deploy D1 snapshot archived and verified; learning data was not changed')
          PY
      - name: Deploy Worker preserving existing secrets
        run: npx wrangler deploy --keep-vars
      - name: Install family code as Worker secret
        run: printf '%s' "$FAMILY_CODE" | npx wrangler secret put FAMILY_CODE
      - name: Verify binding and unchanged snapshot
        run: |
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.request,urllib.error
          base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID'];token=os.environ['CLOUDFLARE_API_TOKEN'];worker=os.environ['WORKER_NAME']
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
              if not data.get('success'):raise SystemExit('Cloudflare verification failed')
              return data['result']
          bindings=get('/workers/scripts/'+worker+'/settings')['bindings'];db=[x for x in bindings if x.get('type')=='d1' and x.get('name')=='DB']
          if len(db)!=1 or (db[0].get('database_id') or db[0].get('id'))!=os.environ['DATABASE_ID']:raise SystemExit('Unexpected production database binding')
          domain=get('/workers/subdomain')['subdomain'];url='https://'+worker+'.'+domain+'.workers.dev/snapshot'
          for n in range(12):
              req=urllib.request.Request(url,headers={'Origin':'https://kota0317.github.io','X-Family-Code':os.environ['FAMILY_CODE'],'User-Agent':'haruki-production-verification/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:result=json.load(r)
                  digest=hashlib.sha256(json.dumps(result.get('data'),sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
                  if result.get('generation')==os.environ['EXPECTED_GENERATION'] and result.get('revision')==int(os.environ['EXPECTED_REVISION']) and digest==os.environ['EXPECTED_DATA_SHA256']:break
                  raise SystemExit('Worker snapshot differs from the pre-deploy D1 snapshot; content was not logged')
              except urllib.error.HTTPError as e:print('API not ready: HTTP',e.code)
              time.sleep(4)
          else:raise SystemExit('Could not verify production API after deployment')
          print('PASS: production binding verified; pre-deploy D1 revision, generation and data hash are unchanged')
          PY
      - name: Verify a production D1 write, readback and duplicate replay
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          worker=os.environ['WORKER_NAME'];code=os.environ['FAMILY_CODE']
          # Resolve the actual Cloudflare workers.dev subdomain without logging credentials or snapshot content.
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/subdomain',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r:sub=json.load(r)['result']['subdomain']
          base='https://'+worker+'.'+sub+'.workers.dev'
          def call(path,method='GET',body=None):
              data=None if body is None else json.dumps(body).encode()
              headers={'Origin':'https://kota0317.github.io','X-Family-Code':code,'User-Agent':'haruki-production-verification/1.0'}
              if body is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  try:reason=json.loads(e.read()).get('error','non_json_http_error')
                  except Exception:reason='non_json_http_error'
                  raise SystemExit('Production probe HTTP '+str(e.code)+' ('+str(reason)+')')
          before=call('/snapshot');probe={'id':'deploy-verify-'+os.environ['GITHUB_RUN_ID'],'type':'sync.verify','baseRevision':before['revision'],'generation':before['generation'],'payload':{}}
          applied=call('/operations','POST',probe);after=call('/snapshot')
          if applied.get('status')!='applied' or after.get('revision')!=before.get('revision')+1 or after.get('data')!=before.get('data') or after.get('generation')!=before.get('generation'):
              raise SystemExit('Production D1 write/readback verification failed; snapshot content was not logged')
          replay=call('/operations','POST',probe);latest=call('/snapshot')
          if not replay.get('replayed') or latest.get('revision')!=after.get('revision') or latest.get('data')!=before.get('data'):
              raise SystemExit('Production idempotency replay verification failed; snapshot content was not logged')
          print('PASS: production D1 operation write, readback and duplicate replay verified; learner snapshot unchanged')
          PY
