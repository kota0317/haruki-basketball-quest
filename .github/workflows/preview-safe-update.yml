name: Update mobile preview without changing its D1 data
on:
  push:
    branches: [work/cloudflare-parent-sync]
    paths: ['.github/workflows/preview-safe-update.yml']
permissions:
  contents: read
concurrency:
  group: haruki-preview-safe-update
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts wrangler
      - name: Verify current staging binding and prepare assets
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,pathlib,shutil
          api='https://api.cloudflare.com/client/v4';token=os.environ['CLOUDFLARE_API_TOKEN'];worker='haruki-sync-qa-44663139065';expected='haruki-mobile-preview-44666798466'
          def call(method,path,data=None):
              req=urllib.request.Request(api+path,data=None if data is None else json.dumps(data).encode(),method=method,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','User-Agent':'haruki-preview-deployer/1.0'})
              with urllib.request.urlopen(req,timeout=30) as response: obj=json.load(response)
              if not obj.get('success'):raise RuntimeError('Cloudflare API failed')
              return obj['result']
          accounts=call('GET','/accounts?per_page=50')
          if len(accounts)!=1:raise RuntimeError('Account selection is not unique')
          account=accounts[0]['id'];prefix='/accounts/'+account
          bindings=call('GET',prefix+'/workers/scripts/'+worker+'/settings')['bindings']
          db=[x for x in bindings if x.get('type')=='d1' and x.get('name')=='DB']
          if len(db)!=1:raise RuntimeError('Preview DB binding not unique')
          dbid=db[0].get('database_id') or db[0].get('id')
          if not dbid:raise RuntimeError('Preview DB binding has no ID')
          details=call('GET',prefix+'/d1/database/'+dbid)
          if details.get('name')!=expected:raise RuntimeError('Unexpected DB name; deployment aborted without changing the database')
          rows=call('POST',prefix+'/d1/database/'+dbid+'/query',{'sql':'SELECT revision FROM family_snapshot WHERE id=1'})
          before=rows[0]['results'][0]['revision']
          domain=call('GET',prefix+'/workers/subdomain')['subdomain'];origin='https://'+worker+'.'+domain+'.workers.dev'
          root=pathlib.Path('staging_assets');root.mkdir()
          for filename in ['index.html','style.css','game.js','eiken-words.js','eiken.js','app.js','quest-ui.js','reading.js','experience.js','rpg.js','opening.js','sw.js']:shutil.copy2(filename,root/filename)
          shutil.copytree('assets',root/'assets');(root/'cloudflare').mkdir()
          for filename in ['merge.js','sync-client.js','migration-preview.js','backup-compare.html']:shutil.copy2('cloudflare/'+filename,root/'cloudflare'/filename)
          (root/'cloudflare'/'sync-config.js').write_text('window.HQ_SYNC_API=location.origin;')
          index=root/'index.html';index.write_text(index.read_text().replace('<body>','<body><div style="background:#b91c1c;color:white;padding:12px;text-align:center;font-weight:bold">検証版：実際の学習記録を入力しないでください</div>'))
          config={'name':worker,'main':'cloudflare/worker.mjs','compatibility_date':'2026-11-01','account_id':account,'workers_dev':True,'vars':{'ALLOWED_ORIGIN':origin},'d1_databases':[{'binding':'DB','database_name':expected,'database_id':dbid}],'assets':{'directory':'./staging_assets','binding':'ASSETS','run_worker_first':['/snapshot']}}
          pathlib.Path('wrangler.json').write_text(json.dumps(config))
          pathlib.Path('preview-guard.json').write_text(json.dumps({'account':account,'worker':worker,'dbid':dbid,'revision':before,'origin':origin}))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CLOUDFLARE_ACCOUNT_ID='+account+'\n')
          print('Existing preview D1 binding verified; no data changed.')
          PY
      - name: Update preview application only
        run: npx wrangler deploy --keep-vars
      - name: Verify binding, revision and updated application
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,time
          guard=json.load(open('preview-guard.json'));base='https://api.cloudflare.com/client/v4/accounts/'+guard['account'];token=os.environ['CLOUDFLARE_API_TOKEN']
          def call(path,data=None):
              req=urllib.request.Request(base+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','User-Agent':'haruki-preview-deployer/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)['result']
          bindings=call('/workers/scripts/'+guard['worker']+'/settings')['bindings'];db=[x for x in bindings if x.get('type')=='d1' and x.get('name')=='DB']
          assert len(db)==1 and (db[0].get('database_id') or db[0].get('id'))==guard['dbid'],'Preview D1 binding changed'
          current=call('/d1/database/'+guard['dbid']+'/query',{'sql':'SELECT revision FROM family_snapshot WHERE id=1'})[0]['results'][0]['revision']
          if current!=guard['revision']:raise RuntimeError('Preview revision changed during deploy; check for concurrent use')
          req=urllib.request.Request(guard['origin']+'/cloudflare/sync-client.js?v=5',headers={'User-Agent':'haruki-preview-deployer/1.0'})
          for attempt in range(6):
              with urllib.request.urlopen(req,timeout=20) as r: text=r.read().decode()
              if 'awardSummary' in text:break
              time.sleep(3)
          else:raise RuntimeError('Updated client not visible')
          req=urllib.request.Request(guard['origin']+'/cloudflare/merge.js?v=4',headers={'User-Agent':'haruki-preview-deployer/1.0'})
          for attempt in range(12):
              with urllib.request.urlopen(req,timeout=20) as r: text=r.read().decode()
              if 'awardTotal' in text:break
              time.sleep(4)
          else:raise RuntimeError('Updated XP provenance logic is not visible')
          req=urllib.request.Request(guard['origin']+'/cloudflare/backup-compare.html',headers={'User-Agent':'haruki-preview-deployer/1.0'})
          with urllib.request.urlopen(req,timeout=20) as r: text=r.read().decode()
          assert 'バックアップの比較' in text, 'Backup comparison unavailable'
          print('PASS: updated preview, unchanged D1 binding and unchanged revision')
          PY
