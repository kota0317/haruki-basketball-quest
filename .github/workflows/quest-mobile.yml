name: Quest mobile QA
on:
  pull_request:
    types: [synchronize, opened, reopened]
permissions:
  contents: read
jobs:
  test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'draft/parent-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm install --no-save --ignore-scripts playwright-core
      - run: mkdir -p qa && python3 -m http.server 8792 --bind 127.0.0.1 > /tmp/quest-http.log 2>&1 &
      - run: node tests/quest-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quest-mobile-screenshots
          path: qa/*.png
          if-no-files-found: ignore
