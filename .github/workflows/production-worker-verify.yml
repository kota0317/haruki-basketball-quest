name: Verify inactive production Worker
on:
  push:
    branches: [work/cloudflare-parent-sync]
    paths: ['.github/workflows/production-worker-verify.yml']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read settings and check inactive endpoint
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.error
          token=os.environ['CLOUDFLARE_API_TOKEN'];base='https://api.cloudflare.com/client/v4';worker='haruki-production-inactive-44733572133'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:obj=json.load(r)
              if not obj.get('success'):raise SystemExit('API lookup failed')
              return obj['result']
          accounts=get('/accounts?per_page=50')
          if len(accounts)!=1:raise SystemExit('Account not unique')
          prefix='/accounts/'+accounts[0]['id'];settings=get(prefix+'/workers/scripts/'+worker+'/settings');bindings=settings['bindings']
          if any(x.get('name') in ('DB','FAMILY_CODE') for x in bindings):raise SystemExit('Worker unexpectedly has database or code')
          domain=get(prefix+'/workers/subdomain')['subdomain'];url='https://'+worker+'.'+domain+'.workers.dev/snapshot'
          for i in range(12):
              req=urllib.request.Request(url,headers={'Origin':'https://kota0317.github.io','User-Agent':'haruki-production-setup/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:status=r.status;data=json.load(r)
              except urllib.error.HTTPError as e:
                  status=e.code
                  try:data=json.load(e)
                  except Exception:data={}
              print('Attempt',i+1,'HTTP',status,'error',data.get('error'))
              if status==503 and data.get('error')=='not_configured' and data.get('database') is False and data.get('code_configured') is False:break
              time.sleep(4)
          else:raise SystemExit('Inactive endpoint not verified')
          print('PASS: Worker deployed inactive without D1 or family code:',worker)
          PY
