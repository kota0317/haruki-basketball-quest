name: Encrypted production backup (manual re-run)
on:
  push:
    branches: [draft/parent-sync]
    paths: [.github/workflows/production-backup.yml]
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check private configuration
        id: config
        env:
          PGDATABASE: ${{ secrets.HQ_BACKUP_DB_URL }}
          HQ_BACKUP_PASSWORD: ${{ secrets.HQ_BACKUP_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$PGDATABASE" ] || [ -z "$HQ_BACKUP_PASSWORD" ]; then
            echo 'Set HQ_BACKUP_DB_URL and HQ_BACKUP_PASSWORD repository secrets, then re-run this job.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install PostgreSQL client
        if: steps.config.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
      - name: Take encrypted backup and verify its integrity
        if: steps.config.outputs.ready == 'true'
        env:
          PGDATABASE: ${{ secrets.HQ_BACKUP_DB_URL }}
          HQ_BACKUP_PASSWORD: ${{ secrets.HQ_BACKUP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          BACKUP_DIR="$(mktemp -d "$RUNNER_TEMP/hq-backup.XXXXXX")"
          trap 'rm -rf "$BACKUP_DIR"' EXIT
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --file="$BACKUP_DIR/database.dump"
          /usr/lib/postgresql/17/bin/pg_restore --list "$BACKUP_DIR/database.dump" > /dev/null
          mkdir -p backup
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -in "$BACKUP_DIR/database.dump" -out backup/haruki-database.dump.enc -pass env:HQ_BACKUP_PASSWORD
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in backup/haruki-database.dump.enc -out "$BACKUP_DIR/recovered.dump" -pass env:HQ_BACKUP_PASSWORD
          cmp "$BACKUP_DIR/database.dump" "$BACKUP_DIR/recovered.dump"
          /usr/lib/postgresql/17/bin/pg_restore --list "$BACKUP_DIR/recovered.dump" > /dev/null
          sha256sum backup/haruki-database.dump.enc > backup/sha256.txt
          echo 'Encrypted database archive created; decryption and archive listing verified. This does not verify a database restore or Auth configuration.'
      - name: Upload encrypted archive
        if: steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: haruki-encrypted-database-backup
          path: backup/
          retention-days: 7
          if-no-files-found: error
