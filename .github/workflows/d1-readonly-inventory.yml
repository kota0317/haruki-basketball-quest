name: Read-only Cloudflare D1 inventory
on:
  push:
    branches: [work/cloudflare-parent-sync]
    paths: ['.github/workflows/d1-readonly-inventory.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: List D1 databases and their Worker bindings
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if not token: raise SystemExit('CLOUDFLARE_API_TOKEN is not available')
          base='https://api.cloudflare.com/client/v4'
          def call(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','User-Agent':'haruki-readonly-d1-inventory/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: status=r.status;obj=json.load(r)
              except urllib.error.HTTPError as e:
                  status=e.code
                  try:obj=json.load(e)
                  except Exception:obj={}
              if status//100!=2 or not obj.get('success'):
                  codes=[x.get('code') for x in obj.get('errors',[]) if isinstance(x,dict)]
                  print('Cloudflare read failed: HTTP',status,'codes',codes)
                  raise SystemExit(1)
              return obj['result']
          accounts=call('/accounts?per_page=50')
          if len(accounts)!=1:raise SystemExit('Account selection is ambiguous')
          account=accounts[0]['id'];print('::add-mask::'+account)
          prefix='/accounts/'+account
          dbs=call(prefix+'/d1/database?per_page=10000')
          scripts=call(prefix+'/workers/scripts')
          # Billing read is optional; report permission limitation without exposing billing details.
          try:
              subscriptions=call(prefix+'/subscriptions')
              plans=[{'rate_plan':(x.get('rate_plan') or {}).get('id'),'state':x.get('state')} for x in subscriptions]
              print('ACCOUNT_SUBSCRIPTIONS',json.dumps(plans,ensure_ascii=False))
          except SystemExit:
              print('ACCOUNT_SUBSCRIPTIONS unavailable (Billing Read permission not granted)')
          bindings=[]
          for script in scripts:
              name=script.get('id')
              if not name:continue
              try:
                  settings=call(prefix+'/workers/scripts/'+name+'/settings')
                  for b in settings.get('bindings',[]):
                      if b.get('type')=='d1':
                          bindings.append({'worker':name,'binding':b.get('name'),'database_id':b.get('database_id') or b.get('id')})
              except SystemExit:
                  print('Worker settings unavailable for:',name)
          for d in dbs:
              dbid=d.get('uuid')
              try:
                  detail=call(prefix+'/d1/database/'+dbid)
              except SystemExit:
                  detail=d
              attached=[x['worker']+':'+str(x['binding']) for x in bindings if x['database_id']==dbid]
              try:
                  query=call(prefix+'/d1/database/'+dbid+'/query')
              except TypeError:
                  query=None
              except SystemExit:
                  query=None
              try:
                  req=urllib.request.Request(base+prefix+'/d1/database/'+dbid+'/query',data=json.dumps({'sql':\"SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'\"}).encode(),method='POST',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','User-Agent':'haruki-readonly-d1-inventory/1.0'})
                  with urllib.request.urlopen(req,timeout=30) as response:table_result=json.load(response)
                  tables=table_result['result'][0]['results']
                  names=[x['name'] for x in tables]
                  snapshot_meta=None
                  if 'family_snapshot' in names:
                      req=urllib.request.Request(base+prefix+'/d1/database/'+dbid+'/query',data=json.dumps({'sql':'SELECT revision, length(body) AS body_bytes FROM family_snapshot WHERE id=1'}).encode(),method='POST',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','User-Agent':'haruki-readonly-d1-inventory/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as response:rows=json.load(response)['result'][0]['results']
                      snapshot_meta=rows[0] if rows else None
              except Exception as e:
                  tables=[];names=[];snapshot_meta={'read_error':type(e).__name__}
              name=d.get('name','')
              haruki=any(x in name.lower() for x in ('haruki','basketball','446','447'))
              role=('HARUKI専用候補' if haruki else '用途要確認')
              if any(('preview' in x.lower() or 'staging' in x.lower() or 'qa' in x.lower()) for x in attached):role='検証・プレビュー接続'
              print(json.dumps({'name':name,'id':dbid,'created_at':detail.get('created_at') or d.get('created_at'),'file_size_bytes':detail.get('file_size'),'workers':attached,'tables':names,'snapshot_metadata_only':snapshot_meta,'initial_classification':role},ensure_ascii=False))
          print('TOTAL_D1_DATABASES',len(dbs))
          print('TOTAL_WORKERS',len(scripts))
          PY
